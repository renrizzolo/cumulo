packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@renr/parcel-plugin-rsc-router@https://codeload.github.com/renrizzolo/parcel-rsc-react/tar.gz/64ad2b344b929bd278f7492802fa1767ba0b5707#path:packages/parcel-plugin-rsc-router': true
  '@renr/parcel-reporter-docgen@https://codeload.github.com/renrizzolo/parcel-rsc-react/tar.gz/64ad2b344b929bd278f7492802fa1767ba0b5707#path:packages/parcel-reporter-docgen': true
  '@renr/parcel-rsc-router@https://codeload.github.com/renrizzolo/parcel-rsc-react/tar.gz/64ad2b344b929bd278f7492802fa1767ba0b5707#path:packages/parcel-rsc-router': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - '@renr/*'

patchedDependencies:
  '@parcel/fs': patches/@parcel__fs.patch
  'parcel@3.0.0-alpha.3': patches/parcel@3.0.0-alpha.3.patch
