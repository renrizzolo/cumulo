packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - '@renr/*'

patchedDependencies:
  '@parcel/fs': patches/@parcel__fs.patch
  '@parcel/packager-react-static@2.16.4': patches/@parcel__packager-react-static@2.16.4.patch
