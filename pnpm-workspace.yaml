packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - '@renr/parcel-reporter-rsc-router@1.0.0-alpha.14'
  - '@vitest/browser-playwright@5.0.0'
  - '@vitest/browser@5.0.0'
  - '@vitest/mocker@5.0.0'
  - '@vitest/pretty-format@5.0.0'
  - '@vitest/spy@5.0.0'
  - '@vitest/ui@5.0.0'
  - '@vitest/utils@5.0.0'
  - vitest@5.0.0

patchedDependencies:
  '@parcel/fs': patches/@parcel__fs.patch
