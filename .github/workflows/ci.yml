name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, format, type check & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build packages & apps
        run: pnpm build

      - name: Type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

  fixtures:
    name: Bundler Fixtures & Browser Visual Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Build packages
        run: pnpm build

      - name: Install Playwright Browsers
        run: pnpm --filter @cumulo/fixtures exec playwright install --with-deps chromium

      - name: Run Bundler Fixtures & Visual Tests
        run: pnpm --filter @cumulo/fixtures test

      - name: Upload Screenshot Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-screenshot-diffs
          path: packages/fixtures/test/browser/__screenshots__/**
          if-no-files-found: ignore
